<svg xmlns="http://www.w3.org/2000/svg" width="144" height="44" viewBox="0 0 144 44" fill="none">
  <defs>
    <linearGradient id="checkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="checkShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#10B981" flood-opacity="0.28" />
    </filter>
  </defs>
  <!-- Main Pill -->
  <rect x="6" y="5" width="132" height="34" rx="17" fill="url(#checkGrad)" filter="url(#checkShadow)" />
