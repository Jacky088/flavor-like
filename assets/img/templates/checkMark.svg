  <path d="M22 22l2 2 4.5-4.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Text Label -->
  <text x="41" y="26" fill="#FFFFFF" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600">已认可</text>
