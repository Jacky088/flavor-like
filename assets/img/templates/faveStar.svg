<svg xmlns="http://www.w3.org/2000/svg" width="144" height="44" viewBox="0 0 144 44" fill="none">
  <defs>
    <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="starShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.32" />
    </filter>
  </defs>
  <!-- Main Pill -->
  <rect x="6" y="5" width="132" height="34" rx="17" fill="url(#starGrad)" filter="url(#starShadow)" />
  <rect x="6.5" y="5.5" width="131" height="33" rx="16.5" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <!-- Star Icon -->
  <g transform="translate(18, 12)">
    <path d="M9 1.5l2.25 4.56 5.03.73-3.64 3.55.86 5.01L9 13.01 4.5 15.35l.86-5.01-3.64-3.55 5.03-.73L9 1.5z" fill="#FFFFFF"/>
  </g>
  <!-- Text Label -->
  <text x="41" y="26" fill="#FFFFFF" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600">收藏</text>
  <!-- Divider -->
  <line x1="74" y1="14" x2="74" y2="30" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  <!-- Capsule Badge -->
  <rect x="81" y="11" width="46" height="22" rx="11" fill="rgba(255,255,255,0.2)" />
  <text x="104" y="26" fill="#FFFFFF" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="700" text-anchor="middle">520</text>
</svg>
