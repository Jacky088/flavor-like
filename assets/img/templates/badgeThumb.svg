<svg xmlns="http://www.w3.org/2000/svg" width="144" height="44" viewBox="0 0 144 44" fill="none">
  <defs>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#8B5CF6" flood-opacity="0.32" />
    </filter>
  </defs>
  <!-- Main Pill -->
  <rect x="6" y="5" width="132" height="34" rx="17" fill="url(#badgeGrad)" filter="url(#badgeShadow)" />
  <rect x="6.5" y="5.5" width="131" height="33" rx="16.5" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <!-- Badge Icon with Star -->
  <g transform="translate(17, 13)">
    <circle cx="8" cy="8" r="7.5" fill="rgba(255,255,255,0.2)" stroke="#FFFFFF" stroke-width="1.2" />
    <path d="M8 3.5l1.3 2.7 3 .4-2.2 2.1.5 3-2.6-1.4-2.6 1.4.5-3-2.2-2.1 3-.4z" fill="#FFFFFF"/>
  </g>
  <!-- Text Label -->
  <text x="40" y="26" fill="#FFFFFF" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600">荣誉</text>
  <!-- Divider -->
  <line x1="74" y1="14" x2="74" y2="30" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  <!-- Capsule Badge -->
  <rect x="81" y="11" width="46" height="22" rx="11" fill="rgba(255,255,255,0.2)" />
  <text x="104" y="26" fill="#FFFFFF" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="700" text-anchor="middle">482</text>
</svg>
