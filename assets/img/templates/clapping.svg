<svg xmlns="http://www.w3.org/2000/svg" width="144" height="44" viewBox="0 0 144 44" fill="none">
  <defs>
    <linearGradient id="clapGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="clapShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Main Pill -->
  <rect x="6" y="5" width="132" height="34" rx="17" fill="url(#clapGrad)" filter="url(#clapShadow)" />
  <rect x="6.5" y="5.5" width="131" height="33" rx="16.5" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <!-- Clap Hands Emoji -->
  <text x="18" y="27" font-size="16">👏</text>
  <!-- Text Label -->
  <text x="42" y="26" fill="#FFFFFF" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600">鼓掌</text>
  <!-- Divider -->
  <line x1="75" y1="14" x2="75" y2="30" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  <!-- Capsule Badge -->
  <rect x="82" y="11" width="46" height="22" rx="11" fill="rgba(255,255,255,0.25)" />
  <text x="105" y="26" fill="#FFFFFF" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="700" text-anchor="middle">340</text>
</svg>
