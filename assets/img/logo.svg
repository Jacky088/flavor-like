<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- SaaS Blue Gradient -->
    <linearGradient id="flavorLikeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <!-- Soft Depth Shadow -->
    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Modern SaaS Squircle Container -->
  <rect width="512" height="512" rx="136" fill="url(#flavorLikeGrad)" />
  <rect x="2.5" y="2.5" width="507" height="507" rx="133.5" stroke="rgba(255, 255, 255, 0.22)" stroke-width="5" />

  <!-- Pulse Heart Brand Symbol -->
  <g transform="translate(256, 256) scale(18) translate(-12, -12)" filter="url(#symbolShadow)" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Heart Contour -->
    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
    <!-- Dynamic ECG Pulse Wave -->
    <path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27" />
  </g>
</svg>
